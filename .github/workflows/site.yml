name: Site

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, gd, mbstring, intl
          tools: composer
      - name: Install Kirby
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
      - name: PHP syntax
        run: find index.php site -name '*.php' -print0 | xargs -0 -n1 php -l
      # Same server as `composer start`; on localhost, Kirby runs with debug on, so errors fail the checks.
      - name: Start the site
        run: |
          php -S localhost:8000 kirby/router.php > server.log 2>&1 &
          for i in $(seq 30); do curl -s -o /dev/null http://localhost:8000/ && break; sleep 1; done
      - name: Smoke test
        run: scripts/smoke-test.sh http://localhost:8000
      - name: Server log on failure
        if: failure()
        run: cat server.log
      # Everything the web server needs: the site from git plus Kirby and its libraries.
      - name: Deploy package
        run: |
          mkdir -p package
          git archive --format=tar HEAD | tar -x -C package
          cp -r kirby vendor package/
      - uses: actions/upload-artifact@v7
        with:
          name: stackwerk-site
          path: package
          include-hidden-files: true
